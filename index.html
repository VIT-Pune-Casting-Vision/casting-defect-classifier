<!DOCTYPE html>
<html>
<head>
    <title>Casting Defect Classifier</title>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f6; text-align: center; padding: 40px; }
        .card { background: white; max-width: 520px; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #1e293b; margin-bottom: 5px; }
        p { color: #64748b; font-size: 14px; margin-top: 0; }
        .status { padding: 12px; background-color: #e2f0d9; color: #2e6930; border-radius: 6px; font-weight: bold; margin: 20px 0; font-size: 13px; }
        input[type="file"] { margin: 15px 0; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 8px; font-size: 18px; font-weight: bold; display: none; }
        .pass { background-color: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
        .fail { background-color: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
        .raw-score { font-size: 12px; color: #64748b; margin-top: 8px; }
        img { max-width: 100%; height: auto; border-radius: 8px; margin-top: 15px; border: 1px solid #e2e8f0; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>⚙️ Surface Defect Classifier</h2>
        <p>Mechanical Engineering Quality Control Project</p>
        <div id="status" class="status">⏳ Connecting to model...</div>

        <input type="file" id="imageUpload" accept="image/*" disabled>

        <div id="resultBox" class="result-box">
            <div id="resultText"></div>
            <div id="rawScore" class="raw-score"></div>
        </div>
        <img id="preview" alt="Uploaded Image">
    </div>

    <script>
        let session;
        const statusDiv = document.getElementById('status');
        const uploadInput = document.getElementById('imageUpload');

        async function loadModel() {
            try {
                ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/";

                const response = await fetch('./model.onnx?v=' + Date.now());
                if (!response.ok) throw new Error(`HTTP ${response.status} — model.onnx not found`);

                const totalBytes = Number(response.headers.get('content-length')) || 0;
                const reader = response.body.getReader();
                const chunks = [];
                let receivedBytes = 0;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    receivedBytes += value.length;
                    const mbLoaded = (receivedBytes / (1024 * 1024)).toFixed(1);
                    const mbTotal = totalBytes ? ` / ${(totalBytes / (1024 * 1024)).toFixed(1)} MB` : ' MB';
                    statusDiv.textContent = `⏳ Downloading Model: ${mbLoaded}${mbTotal}...`;
                }

                statusDiv.textContent = "⚙️ Initializing Neural Network...";
                const modelBuffer = new Uint8Array(receivedBytes);
                let offset = 0;
                for (const chunk of chunks) {
                    modelBuffer.set(chunk, offset);
                    offset += chunk.length;
                }

                session = await ort.InferenceSession.create(modelBuffer.buffer, { executionProviders: ['wasm'] });
                statusDiv.textContent = "✅ Model Loaded: model.onnx";
                uploadInput.disabled = false;
            } catch (e) {
                statusDiv.style.backgroundColor = "#fee2e2";
                statusDiv.style.color = "#b91c1c";
                statusDiv.textContent = "❌ Error: " + e.message;
            }
        }
        loadModel();

        uploadInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file || !session) return;

            const img = document.getElementById('preview');
            img.src = URL.createObjectURL(file);
            img.style.display = 'block';

            img.onload = async () => {
                const canvas = document.createElement('canvas');
                canvas.width = 150;
                canvas.height = 150;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, 150, 150);
                const imgData = ctx.getImageData(0, 0, 150, 150).data;

                const inputName = session.inputNames[0];
                const floatData = new Float32Array(1 * 150 * 150 * 3);
                for (let i = 0, j = 0; i < imgData.length; i += 4, j += 3) {
                    floatData[j] = imgData[i] / 255.0;
                    floatData[j + 1] = imgData[i + 1] / 255.0;
                    floatData[j + 2] = imgData[i + 2] / 255.0;
                }

                const tensor = new ort.Tensor('float32', floatData, [1, 150, 150, 3]);
                const results = await session.run({ [inputName]: tensor });
                const rawOutput = results[session.outputNames[0]].data[0];

                const resultBox = document.getElementById('resultBox');
                const resultText = document.getElementById('resultText');
                const rawScore = document.getElementById('rawScore');

                resultBox.style.display = 'block';
                rawScore.textContent = `(Raw Model Output: ${rawOutput.toFixed(4)})`;

                if (rawOutput >= 0.5) {
                    resultBox.className = "result-box pass";
                    resultText.textContent = `✅ QUALITY PASS (OK PART) — Confidence: ${(rawOutput * 100).toFixed(2)}%`;
                } else {
                    resultBox.className = "result-box fail";
                    resultText.textContent = `❌ DEFECT DETECTED (DEFECTIVE PART) — Confidence: ${((1 - rawOutput) * 100).toFixed(2)}%`;
                }
            };
        });
    </script>
</body>
</html>
